<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">

  <!-- 1. Navbar (with the Dark mode button) -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
      <button type="button" class="btn btn-outline-light btn-sm" id="themeToggle">🌙 Dark mode</button>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Error and success messages appear here -->
    <div id="alertBox"></div>

    <!-- 2. Summary cards (CSS Grid, calculated from ALL expenses, not the filtered list) -->
    <div class="summary-grid">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-subtitle text-muted mb-2">Total</h6>
          <p class="fs-3 fw-bold mb-0" id="totalAmount">0.00</p>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-subtitle text-muted mb-2">Number of expenses</h6>
          <p class="fs-3 fw-bold mb-0" id="expenseCount">0</p>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-subtitle text-muted mb-2">Highest expense</h6>
          <p class="fs-3 fw-bold mb-0" id="highestAmount">0.00</p>
          <p class="text-muted mb-0" id="highestTitle">—</p>
        </div>
      </div>
    </div>

    <!-- 3. Form to add an expense -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add an expense</h5>
        <form id="expenseForm" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="titleInput" class="form-label">Title</label>
              <input type="text" class="form-control" id="titleInput" maxlength="100">
              <div class="invalid-feedback" id="titleError"></div>
            </div>
            <div class="col-6 col-md-2">
              <label for="amountInput" class="form-label">Amount</label>
              <input type="number" class="form-control" id="amountInput" step="0.01" min="0.01">
              <div class="invalid-feedback" id="amountError"></div>
            </div>
            <div class="col-6 col-md-3">
              <label for="categoryInput" class="form-label">Category</label>
              <select class="form-select" id="categoryInput">
                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback" id="categoryError"></div>
            </div>
            <div class="col-12 col-md-3">
              <label for="dateInput" class="form-label">Date</label>
              <input type="date" class="form-control" id="dateInput">
              <div class="invalid-feedback" id="dateError"></div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-3" id="addButton">Add expense</button>
        </form>
      </div>
    </div>

    <!-- 4. Filter by category -->
    <div class="d-flex align-items-center gap-2 mb-3">
      <label for="categoryFilter" class="form-label mb-0">Filter:</label>
      <select class="form-select w-auto" id="categoryFilter">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Spinner: visible only while loading -->
    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- 5. Table: the rows are built with JavaScript -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="expensesBody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 6. Edit modal (hidden until the user presses "Edit") -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- Errors from the server appear here, inside the modal -->
            <div id="editAlertBox"></div>

            <div class="mb-3">
              <label for="editTitleInput" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitleInput" maxlength="100">
              <div class="invalid-feedback" id="editTitleError"></div>
            </div>
            <div class="mb-3">
              <label for="editAmountInput" class="form-label">Amount</label>
              <input type="number" class="form-control" id="editAmountInput" step="0.01" min="0.01">
              <div class="invalid-feedback" id="editAmountError"></div>
            </div>
            <div class="mb-3">
              <label for="editCategoryInput" class="form-label">Category</label>
              <select class="form-select" id="editCategoryInput">
                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback" id="editCategoryError"></div>
            </div>
            <div class="mb-3">
              <label for="editDateInput" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDateInput">
              <div class="invalid-feedback" id="editDateError"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveButton">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
